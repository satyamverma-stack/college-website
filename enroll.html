<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="enroll.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <div><img src="logo.jpeg" alt="College Logo"></div>
<div>
            <h1>BABU SUNDER SINGH DEGREE COLLEGE</h1>
            <h3>Affiliated to Lucknow University</h3>
            <p><i>Empowering Education, Enriching Future</i></p>
        </div>
            <div><img src="bssgi.png" alt="College Logo"></div>

        </header>

        <!-- Form -->
        <form>

            <h2>🎓 STUDENT ENROLLMENT FORM</h2>

            <!-- Personal Information -->
            <fieldset>
                <legend>1. Personal Information</legend>

                <div class="row">

                    <div>
                        <label>Full Name of Student *</label>
                        <input type="text" placeholder="Enter full name">
                    </div>

                    <div>
                        <label>Father's Name *</label>
                        <input type="text" placeholder="Enter father's name">
                    </div>

                    <div>
                        <label>Mother's Name *</label>
                        <input type="text" placeholder="Enter mother's name">
                    </div>

                </div>

                <div class="row">

                    <div>
                        <label>Date of Birth *</label>
                        <input type="date">
                    </div>

                    <div>
                        <label>Gender *</label><br>

                        <input type="radio" name="gender"> Male
                        <input type="radio" name="gender"> Female
                        <input type="radio" name="gender"> Other

                    </div>

                    <div>
                        <label>Aadhar Number *</label>
                        <input type="text" maxlength="12" placeholder="Enter 12 digit Aadhar number">
                    </div>

                </div>

                <div class="row">

                    <div>
                        <label>Mobile Number *</label>
                        <input type="tel" placeholder="Enter mobile number">
                    </div>

                    <div>
                        <label>Email ID</label>
                        <input type="email" placeholder="Enter email id">
                    </div>

                    <div>
                        <label>Nationality *</label>

                        <select>
                            <option>Indian</option>
                            <option>Other</option>
                        </select>

                    </div>

                </div>

                <label>Address *</label>

                <textarea rows="4" placeholder="Enter permanent address"></textarea>

                <div class="row">

                    <div>
                        <label>City *</label>
                        <input type="text" placeholder="Enter city">
                    </div>

                    <div>
                        <label>State *</label>

                        <select>
                            <option>Select State</option>
                        </select>

                    </div>

                    <div>
                        <label>PIN Code *</label>
                        <input type="text" placeholder="Enter pin code">
                    </div>

                </div>

            </fieldset>

            <!-- Academic Information -->

            <fieldset>

                <legend>2. Academic Information</legend>

                <div class="row">

                    <div>

                        <label>Course Applied For *</label>

                        <select>
                            <option>Select Course</option>
                            <option>BCA</option>
                            <option>BBA</option>
                            <option>B.Com</option>
                        </select>

                    </div>

                    <div>

                        <label>Qualification *</label>

                        <select>
                            <option>Select Qualification</option>
                            <option>10th</option>
                            <option>12th</option>
                            <option>Graduation</option>
                        </select>

                    </div>

                    <div>

                        <label>Passing Year *</label>

                        <select>
                            <option>Select Year</option>
                        </select>

                    </div>

                </div>

                <div class="row">

                    <div>

                        <label>School / College Name *</label>

                        <input type="text" placeholder="Enter school / college name">

                    </div>

                    <div>

                        <label>Board / University *</label>

                        <input type="text" placeholder="Enter board / university">

                    </div>

                    <div>

                        <label>Percentage / CGPA *</label>

                        <input type="text" placeholder="Enter percentage / CGPA">

                    </div>

                </div>

            </fieldset>

            <!-- Upload Documents -->

            <fieldset>

                <legend>3. Upload Documents</legend>

                <div class="row">

                    <div>
                        <label>Photo *</label>
                        <input type="file">
                    </div>

                    <div>
                        <label>Aadhar Card *</label>
                        <input type="file">
                    </div>

                    <div>
                        <label>10th Marksheet *</label>
                        <input type="file">
                    </div>

                    <div>
                        <label>12th Marksheet *</label>
                        <input type="file">
                    </div>

                    <div>
                        <label>Transfer Certificate</label>
                        <input type="file">
                    </div>

                    <div>
                        <label>Character Certificate</label>
                        <input type="file">
                    </div>

                </div>

            </fieldset>

            <!-- Declaration -->

            <fieldset>

                <legend>4. Declaration</legend>

                <label>

                    <input type="checkbox">

                    I hereby declare that the information provided above is true to the best of my knowledge and
                    belief. I understand that any false information may lead to cancellation of my admission.

                </label>

                <br><br>

                <div class="row">

                    <div>
                        <label>Date</label>
                        <input type="date">
                    </div>

                    <div>
                        <label>Student Signature</label>
                        <input type="text" placeholder="Sign here">
                    </div>

                    <div>
                        <label>Parent / Guardian Signature</label>
                        <input type="text" placeholder="Sign here">
                    </div>

                </div>

            </fieldset>

            <br>

            <button type="submit">
                <a href="confirmation.html">SUBMIT ENROLLMENT FORM</a>
            </button>

        </form>

    </div>

</body>
</html>
